name: Monitor de Apartamentos

# Roda DE 2 EM 2 HORAS (12x/dia), mais o disparo manual.
#
# A cadência subiu de semanal para 2x/dia e depois para de 2 em 2 horas,
# sempre pelo mesmo motivo, cada vez mais visível: anúncio de aluguel bom
# sai do ar em horas. Com duas leituras diárias, o imóvel publicado às 9h e
# alugado às 15h nunca chegava a aparecer -- e o histórico de preço só
# registrava o degrau, nunca o momento.
#
# O minuto 13 é de propósito. Cron de hora cheia ("0 11 * * *") cai na
# janela de maior concorrência do GitHub e costuma atrasar de 10 a 30 min --
# a fila é global. Um minuto quebrado sai dessa disputa e o disparo fica
# muito mais próximo do horário pedido.
#
# Era semanal. Aluguel gira rápido: um imóvel bom some em dias, e com
# cadência semanal a série de preço nunca capturava variação -- medido, 3
# execuções produziram 261 pontos de histórico e ZERO mudança observada.
on:
  schedule:
    # De 2 em 2 horas, no minuto 13 (ver acima o porquê do minuto quebrado).
    # Era 2x/dia. Aluguel bom sai do ar em horas, não em dias: com duas
    # leituras diárias, o imóvel publicado às 9h e alugado às 15h nunca
    # chegava a aparecer. São 12 rodadas/dia -- e 12 commits do banco, que é
    # binário: a poda diária de inativos e o VACUUM de domingo passam a ser
    # o que segura o tamanho do repositório, não mais um detalhe.
    - cron: "13 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

# Duas rodadas simultâneas brigariam pelo push do banco. cancel-in-progress
# fica FALSE de propósito: a rodada em andamento já coletou dados que seriam
# perdidos -- melhor enfileirar do que descartar.
concurrency:
  group: monitor-apartamentos
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Rodar o monitor
        run: python main.py

      - name: Persistir banco/planilha no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add saida/apartamentos.db saida/apartamentos.xlsx
          if git diff --staged --quiet; then
            echo "Sem mudanças pra commitar"
            exit 0
          fi
          git commit -m "chore: atualiza dados da rodada diária [skip ci]"
          # Rebase + retry antes do push. O banco é binário: se outra rodada
          # (ou um run manual) commitou nesse meio-tempo, o push é rejeitado
          # e a rodada inteira perde o histórico -- sem falhar visivelmente,
          # porque o passo anterior já tinha passado (P-10 da auditoria).
          for tentativa in 1 2 3; do
            if git push; then
              echo "push OK na tentativa $tentativa"
              exit 0
            fi
            echo "push rejeitado; rebase e nova tentativa ($tentativa)"
            git pull --rebase --strategy-option=ours || git rebase --abort
            sleep $((tentativa * 5))
          done
          echo "::error::não foi possível persistir o banco após 3 tentativas"
          exit 1

      - name: Preparar artefato do Pages
        run: |
          mkdir -p _site
          cp saida/dashboard.html _site/index.html

      - name: Upload do artefato do Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publicar:
    needs: scrape
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
